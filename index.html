<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Hot Mess Express</title>
<meta name="theme-color" content="#1a1018">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Slap a bird through a lava cave, dodge a dragon, escape to the forest.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>window.PRIVACY_URL = 'privacy.html'; // shows the privacy policy link on the title screen</script>
<style>
  /* the game's font, bundled so it works offline */
  @font-face { font-family: "Baloo 2"; font-weight: 500; font-display: swap; src: url("fonts/baloo-2-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Baloo 2"; font-weight: 700; font-display: swap; src: url("fonts/baloo-2-latin-700-normal.woff2") format("woff2"); }
  @font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("fonts/baloo-2-latin-800-normal.woff2") format("woff2"); }
  html, body { overscroll-behavior: none; touch-action: none; }
  :root {
    --page: #f6dcc8;
    --frame: #4a2c3a;
    --ink: #4a2c3a;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #1d1220; --frame: #6b4257; --ink: #f6dcc8; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #1d1220; --frame: #6b4257; --ink: #f6dcc8; color-scheme: dark; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .stage {
    /* the game fills the entire screen; the 400x640 play area is centered and the scenery extends to the edges */
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  canvas:focus-visible { outline: 3px solid #ffd36b; outline-offset: -3px; }
</style>
</head>
<body>
<div class="stage">
  <canvas id="game" width="400" height="640" tabindex="0" aria-label="Hot Mess Express game. Press space, click or tap to slap the bird so it flies through the lava cave, past geysers and stalactites."></canvas>
</div>

<script>
(() => {
  const W = 400, H = 640;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const FONT = '"Baloo 2", "Trebuchet MS", system-ui, sans-serif';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const C = {
    skyTop: '#7a6fb3', skyMid: '#e9a3a0', skyLow: '#ffd9a8',
    stone: '#9a8478', stoneLight: '#b9a397', stoneDark: '#6f5b52', ivy: '#5b8c4a',
    grass: '#7fae5a', grassDark: '#5e8d42', soil: '#8a5a3c',
    body: '#5a7fa8', bodyDark: '#3f5f85', belly: '#f08a5d', beak: '#f6c445',
    skin: '#f2c09a', skinDark: '#d99b74', outline: '#3a2230',
    text: '#fff7ea', gold: '#ffd36b', red: '#e2574c'
  };

  // VX/VY: how much extra world is visible left/right and above/below the 400x640 play area
  let VX = 0, VY = 0, VS = 1, SAFE_T = 0;
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const rect = canvas.getBoundingClientRect();
    const rw = Math.max(1, rect.width), rh = Math.max(1, rect.height);
    VS = Math.min(rw / W, rh / H); // the whole play area always fits, so the game is equally fair on every screen
    VX = (rw / VS - W) / 2; VY = (rh / VS - H) / 2;
    canvas.width = Math.round(rw * dpr); canvas.height = Math.round(rh * dpr);
    const k = VS * dpr;
    ctx.setTransform(k, 0, 0, k, VX * k, VY * k);
    try { SAFE_T = (parseFloat(getComputedStyle(document.documentElement).paddingTop) || 0) / VS; } catch { SAFE_T = 0; }
  }
  window.addEventListener('resize', resize);

  let best = 0;
  try { best = parseInt(localStorage.getItem('slapwing-best') || '0', 10) || 0; } catch { /* ignore */ }
  function saveBest() { try { localStorage.setItem('slapwing-best', String(best)); } catch { /* ignore */ } }

  // Sound
  let audio = null, muted = false, noiseBuf = null;
  function ac() {
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = audio.createBuffer(1, audio.sampleRate * 0.2, audio.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
    }
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  function blip(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(a.destination);
      o.start(t); o.stop(t + dur);
    } catch { /* ignore */ }
  }
  function slapSound(pitch = 1) {
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime;
      // 1. the sharp crack of a palm hitting feathers
      const src = a.createBufferSource(); src.buffer = noiseBuf;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
      const pk = a.createBiquadFilter(); pk.type = 'peaking'; pk.frequency.value = 2400 + Math.random() * 900; pk.gain.value = 10;
      const g = a.createGain(); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
      src.connect(hp).connect(pk).connect(g).connect(a.destination);
      src.start(t);

      // 2. a soft thump of the body getting knocked
      const o = a.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
      const og = a.createGain(); og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(og).connect(a.destination); o.start(t); o.stop(t + 0.15);

      // 3. the bird's startled squawk: jumps up in pitch, then falls with a warble
      const s0 = t + 0.04, dur = 0.2 + Math.random() * 0.12;
      const base = (900 + Math.random() * 500) * pitch;
      const sq = a.createOscillator(); sq.type = 'sawtooth';
      sq.frequency.setValueAtTime(base, s0);
      sq.frequency.linearRampToValueAtTime(base * 1.5, s0 + 0.04);
      sq.frequency.exponentialRampToValueAtTime(base * 0.6, s0 + dur);
      const vib = a.createOscillator(); vib.frequency.value = 26 + Math.random() * 8;
      const vg = a.createGain(); vg.gain.value = base * 0.08;
      vib.connect(vg).connect(sq.frequency);
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = base * 1.6; bp.Q.value = 2.5;
      const sg = a.createGain();
      sg.gain.setValueAtTime(0.0001, s0);
      sg.gain.exponentialRampToValueAtTime(0.35, s0 + 0.02);
      sg.gain.exponentialRampToValueAtTime(0.001, s0 + dur);
      sq.connect(bp).connect(sg).connect(a.destination);
      sq.start(s0); sq.stop(s0 + dur + 0.02);
      vib.start(s0); vib.stop(s0 + dur + 0.02);
    } catch { /* ignore */ }
  }

  function fartSound() {
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime + 0.05, dur = 0.18 + Math.random() * 0.15;
      const o = a.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(95 + Math.random() * 30, t);
      o.frequency.exponentialRampToValueAtTime(55, t + dur);
      const lfo = a.createOscillator(); lfo.frequency.value = 22 + Math.random() * 10;
      const lg = a.createGain(); lg.gain.value = 25;
      lfo.connect(lg).connect(o.frequency);
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 600;
      const g = a.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(f).connect(g).connect(a.destination);
      o.start(t); o.stop(t + dur + 0.02); lfo.start(t); lfo.stop(t + dur + 0.02);
    } catch { /* ignore */ }
  }

  // the bird hits the lava: a pillar of fire, and it burns away to ash
  function incinerate(b) {
    explode(b.x, FLOOR - 4, false, 'FWOOSH!');
    pillars.push({ x: b.x, t: 0 });
    for (let i = 0; i < 18; i++) {
      feathers.push({ x: b.x + (Math.random() - 0.5) * 20, y: FLOOR - 10, vx: (Math.random() - 0.5) * 80, vy: -120 - Math.random() * 200, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 6, life: 1.6, col: i % 3 ? '#3a3034' : '#ff8a1f' });
    }
    if (!incinerated) { incinerated = true; overAt = performance.now() + 900; }
  }

  function explode(x, y = FLOOR - 4, quiet = false, word = null) {
    const air = y < FLOOR - 20;
    explosions.push({ x, y, air, t: 0, word: word || (Math.random() < 0.5 ? 'Boom!' : 'Kaboom!') });
    for (let i = 0; i < 14; i++) {
      const a = air ? Math.random() * Math.PI * 2 : Math.PI + Math.random() * Math.PI;
      const v = 140 + Math.random() * 220;
      feathers.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 12, life: 0.9, col: ['#ffd36b', '#ff8a1f', '#ff4d1f', '#fff3dc'][i % 4] });
    }
    if (!reduceMotion) shake = Math.max(shake, 6);
    if (muted || quiet) return;
    try {
      const a = ac(), t = a.currentTime;
      // rumbling blast
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.35;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(200, t + 0.5);
      const g = a.createGain(); g.gain.setValueAtTime(0.7, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      src.connect(lp).connect(g).connect(a.destination); src.start(t);
      // deep thud underneath
      const o = a.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(35, t + 0.4);
      const og = a.createGain(); og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(og).connect(a.destination); o.start(t); o.stop(t + 0.46);
    } catch { /* ignore */ }
  }

  // each new wave of dragons comes back in a new color and fires one more fireball per breath
  const DRAGON_COLORS = [
    { name: 'red',    body: '#c0392b', dark: '#7a1f1a', belly: '#f2b05e', wing: '#5a1414', core: '#fffbe0', mid: '#ffd36b', trail: '255,110,30' },
    { name: 'purple', body: '#7d3cc0', dark: '#4a1f7a', belly: '#e6b8f2', wing: '#3a1460', core: '#f5e6ff', mid: '#c89bff', trail: '150,70,255' },
    { name: 'blue',   body: '#2f6fd1', dark: '#1a3f7a', belly: '#a8d8f2', wing: '#142c5a', core: '#e6f7ff', mid: '#7fd1ff', trail: '40,150,255' },
    { name: 'green',  body: '#3a9a4a', dark: '#1f5a2a', belly: '#d8f2a8', wing: '#143a1a', core: '#f0ffe0', mid: '#9cff6b', trail: '70,210,70' },
    { name: 'gold',   body: '#d4a017', dark: '#8a6a10', belly: '#fff0b8', wing: '#5a440a', core: '#fffbe0', mid: '#ffe680', trail: '235,185,30' },
    { name: 'shadow', body: '#3a3540', dark: '#1a171d', belly: '#9a8fa8', wing: '#0d0b0f', core: '#ffe6fa', mid: '#ff7ae0', trail: '230,50,190' }
  ];

  function newFly(x = W + 30) {
    return { x, y: H * 0.42, t: Math.random() * 6, caught: false, eaten: false, respawn: 0, hue: Math.floor(Math.random() * 3) };
  }

  function newDragon(i, n) {
    return { x: -70 - i * 25, y: H * 0.45, t: Math.random() * 6, i, n, cool: 1.8 + Math.random() * 2 + i * 0.25, dead: false, vy: 0, rot: 0, roar: 0, col: wave % DRAGON_COLORS.length, shots: wave + 1, walls: wave >= 4, plan: null, charge: 0 };
  }

  function roarSound() {
    if (muted || time - lastRoar < 0.3) return;
    lastRoar = time;
    try {
      const a = ac(), t = a.currentTime;
      const o = a.createOscillator(); o.type = 'sawtooth';
      o.frequency.setValueAtTime(140, t); o.frequency.linearRampToValueAtTime(190, t + 0.08); o.frequency.exponentialRampToValueAtTime(70, t + 0.45);
      const lfo = a.createOscillator(); lfo.frequency.value = 30; const lg = a.createGain(); lg.gain.value = 30; lfo.connect(lg).connect(o.frequency);
      const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900;
      const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.04); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(f).connect(g).connect(a.destination); o.start(t); o.stop(t + 0.52); lfo.start(t); lfo.stop(t + 0.52);
      // whoosh of the fireball
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.5;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(2000, t + 0.3); bp.Q.value = 1;
      const g2 = a.createGain(); g2.gain.setValueAtTime(0.3, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      src.connect(bp).connect(g2).connect(a.destination); src.start(t);
    } catch { /* ignore */ }
  }

  // the bomb egg goes off: every dragon chasing you is blown up, and twice as many come next time
  function killDragons() {
    let first = true;
    for (const d of bugs) {
      if (d.dead) continue;
      d.dead = true; d.vy = -180; d.rot = 0;
      explode(d.x + 10, d.y, !first);
      first = false;
    }
    fireballs = []; walls = [];
    gulp = 1.6;
    if (state === 'play') {
      wave++; // always a single dragon; it just breathes one more fireball each time it comes back
      respawn = 2.4;
    }
  }

  function splatSound() {
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime;
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.8;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1200;
      const g = a.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      src.connect(lp).connect(g).connect(a.destination); src.start(t);
    } catch { /* ignore */ }
    blip(220, 0.12, 'sine', 0.1, -120);
  }

  // ---- walls of fire (5th dragon onward) ----
  const WALL_CHARGE = 1.1, WALL_W = 28, FIRE_CHARGE = 0.5;
  // pick a gap that is always passable: it never sits behind a stalactite tip or inside a geyser
  function planWall(d) {
    const tier = wave - 4;
    const lead = birds[0], z = Math.max(lead.size || 1, lead.targetSize || 1);
    const gapH = 36 * z + Math.max(16, 74 - tier * 12);
    const wSpeed = 380 + Math.min(6, tier) * 30;
    const next = Math.max(1.9, 2.8 - tier * 0.15) + Math.random() * 0.6;
    const T = WALL_CHARGE + Math.max(0, (lead.x - 14 * z) - (d.x + 30 + WALL_W)) / wSpeed;
    let lo = ROOF + 14 + gapH / 2, hi = FLOOR - 14 - gapH / 2;
    const T1 = T + (WALL_W + 30 * z + 40) / wSpeed;
    for (const c of cols) {
      // any obstacle passing the bird around the time the wall does must not block the gap
      const tA = (c.x - (lead.x + 16 * z)) / speed, tL = (c.x + c.w - (lead.x - 14 * z)) / speed;
      if (tL + 0.35 < T || tA - 0.35 > T1) continue;
      if (c.kind === 'geyser') hi = Math.min(hi, FLOOR - c.h - 8 - gapH / 2);
      else lo = Math.max(lo, c.by + 8 + gapH / 2);
    }
    if (lo > hi) return null;
    const gapY = Math.max(lo, Math.min(hi, lead.y + (Math.random() - 0.5) * 280));
    return { gapY, gapH, speed: wSpeed, next };
  }

  function flameSound() {
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime;
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.25; src.loop = true;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(600, t); lp.frequency.linearRampToValueAtTime(2200, t + 0.25); lp.frequency.exponentialRampToValueAtTime(300, t + 0.8);
      const g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.08); g.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
      src.connect(lp).connect(g).connect(a.destination); src.start(t); src.stop(t + 0.9);
    } catch { /* ignore */ }
  }

  // the stink egg hits the lava: the lava erupts and a stinking glob of it blasts up into the dragon's face
  function stinkBomb(x) {
    stinks.push({ x, t: 0 });
    pillars.push({ x, t: 0.15 });
    const foe = bugs.find(d => !d.dead);
    if (foe) lavaShots.push({ x, y: FLOOR - 6, vx: (foe.x - x) * 0.6, vy: -700, target: foe, t: 0 });
    fartSound(); sizzle(x);
    for (let k = 0; k < 10; k++) feathers.push({ x: x + (Math.random() - 0.5) * 20, y: FLOOR - 4, vx: (Math.random() - 0.5) * 80, vy: -60 - Math.random() * 100, rot: 0, vr: 0, life: 0.9, col: k % 2 ? '#9be15d' : '#ff8a1f' });
  }

  // the lava glob lands: the dragon is stunned for about a second
  function lavaHit(d, s) {
    d.stun = 1.3; d.stink = 1.3; d.lava = 1.0;
    d.cool += 1.2;                // its next attack comes later
    if (d.aim) d.fcharge += 1.2;  // a fireball it was winding up is held back too
    guardMsg = 1.4;
    explode(s.x, s.y, true, 'Splash!');
    blip(160, 0.25, 'sawtooth', 0.12, -80);
  }

  function sizzle(x) {
    for (let i = 0; i < 5; i++) feathers.push({ x, y: FLOOR, vx: (Math.random() - 0.5) * 120, vy: -80 - Math.random() * 120, rot: 0, vr: 0, life: 0.6, col: Math.random() < 0.5 ? '#ffb347' : '#ff6a2a' });
    if (muted) return;
    try {
      const a = ac(), t = a.currentTime;
      const src = a.createBufferSource(); src.buffer = noiseBuf; src.playbackRate.value = 0.6;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3000;
      const g = a.createGain(); g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      src.connect(hp).connect(g).connect(a.destination); src.start(t);
    } catch { /* ignore */ }
  }

  const GRAVITY = 1800, JUMP = -520, JUMP2 = -520;
  const ROOF = 26; // bottom of the cave ceiling rock
  const GOAL = 100;
  const COL_W = 68, FLOOR = H - 64;
  const R = 15;
  const GROUND_Y = FLOOR - 22; // where a normal-size bird stands
  const groundOf = b => FLOOR - 22 * (b.size || 1); // bigger birds stand taller

  let state = 'ready';
  let paused, ending, lavaShots, stinks, walls, wallDeath, guards, slapCount, guardMsg, wave, fly, munch, pillars, incinerated, fireballs, dragonCount, warn, roasted, lastRoar, explosions, toasted, dist, grow, bird, birds, dbl, bug, bugs, gulp, respawn, trail, poops, poopCount, cols, feathers, slaps, eggs, eggCount, chicks, chickCount, score, speed, gap, spawnX, time, flash, shake, overAt, newBest, wince;

  function reset() {
    bird = { x: 110, y: H * 0.42, vy: 0, squish: 0, tilt: 0, wing: 0, mark: 0, jumps: 0, size: 1, targetSize: 1 };
    grow = 0; toasted = false; dist = 0; explosions = [];
    birds = [bird]; dbl = 0;
    wave = 0; paused = false; ending = null; lavaShots = []; stinks = []; walls = []; wallDeath = false; guards = []; slapCount = 0; guardMsg = 0;
    bug = newDragon(0, 1);
    bugs = [bug]; gulp = 0; respawn = 0;
    fireballs = []; dragonCount = 1; warn = 0; roasted = false; lastRoar = 0; pillars = []; incinerated = false; munch = 0;
    fly = newFly(300);
    cols = []; feathers = []; slaps = []; eggs = []; eggCount = 0; chicks = []; chickCount = 0; trail = []; poops = []; poopCount = 0;
    score = 0; speed = 270; gap = 148; time = 0; flash = 0; shake = 0; newBest = false; wince = 0;
    spawnX = W + 160;
  }
  reset();

  const clouds = Array.from({ length: 6 }, (_, i) => ({ x: i * 80 + Math.random() * 40, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.7 }));
  const hills = Array.from({ length: 10 }, (_, i) => ({ x: i * 90, h: 50 + Math.random() * 60 }));

  function addColumn() {
    const seed = Math.random() * 1000;
    if (score >= 2 && Math.random() < 0.45) {
      // a stalactite: a rock spike pointing down from the ceiling
      const w = 50 + Math.random() * 40;
      const sz = birds[0].targetSize || 1;
      // always leave room under the tip: the bird's height (allowing for its next growth spurt)

      const lowest = FLOOR - 125 - 36 * (sz + 0.12), highest = ROOF + 140;
      const by = lowest - Math.random() * Math.max(0, lowest - highest) * 0.7;

  // when each coming wall of fire will sweep past the bird, and where its gap is

  // how high a geyser is spitting right now

  function slap() {
    if (paused) { paused = false; return; } // a tap while paused just resumes

     // a slap on the ground is a jump; every slap in the air is a flap, so the bird can fly
     const jumpers = birds;
     wince = 0.25;
     if (!reduceMotion) shake = Math.max(shake, 3);
     slapSound();
     fartSound();
     // every 10 slaps, a little bodyguard bird joins to take fireballs for you
     slapCount++;

       // every 20th slap the bird lays a stink egg: it drops into the lava and the stench stuns the dragon
       eggs.push({ x: birds[0].x - 14, y: birds[0].y + 10, vx: -50, vy: 60, rot: 0, spin: 4, cracked: false, t: 0, stinkEgg: true });
     }

      // 1 in 5 eggs fly back and hit a random dragon; the rest drop into the lava
      const foes = bugs.filter(d => !d.dead && d.x > -20);
      const tgt = foes.length && Math.random() < 0.2 ? foes[Math.floor(Math.random() * foes.length)] : null;
      eggs.push({ x: bird.x - 10, y: bird.y + 8, vx: tgt ? -200 : -25, vy: tgt ? -160 : 40, rot: -0.3, spin: tgt ? -14 : (Math.random() - 0.5) * 6, cracked: false, t: 0, baby: false, target: tgt });

        feathers.push({
          x: bird.x + (Math.random() - 0.5) * 16, y: bird.y + 6,
          vx: (Math.random() - 0.5) * 120, vy: -40 - Math.random() * 80,
          rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8, life: 1.2,
          col: Math.random() < 0.6 ? C.body : C.belly

     }

    }
  }

  function hit() {
    if (state !== 'play') return;

    for (let i = 0; i < 10; i++) {
      feathers.push({ x: bird.x, y: bird.y, vx: (Math.random() - 0.5) * 220, vy: -60 - Math.random() * 140, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10, life: 1.6, col: Math.random() < 0.6 ? C.body : C.belly });

  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    const p = toLocal(e);
    const btnY = -VY + SAFE_T + 30;
    if (state === 'ready' && window.PRIVACY_URL && Math.abs(p.x - W / 2) < 80 && Math.abs(p.y - (H + Math.min(VY, 40) - 22)) < 18) { location.href = window.PRIVACY_URL; return; }
    if (Math.hypot(p.x - (W + VX - 30), p.y - btnY) < 28) { muted = !muted; return; }

  window.addEventListener('keydown', e => {

      const formation = H * 0.45 + spread * Math.min(440, d.n * 60);
