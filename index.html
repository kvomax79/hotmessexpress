    guardMsg = Math.max(0, guardMsg - dt);
    const liveGuards = guards.filter(g => !g.dead);
    liveGuards.forEach((g, k) => {
      const lead = birds[0], z = lead.size || 1;
      g.hatch = (g.hatch || 0) + dt;
      const a = Math.PI * (2 / 3 + (k + 0.5) / liveGuards.length * 2 / 3) + Math.sin(time * 1.5 + g.seed) * 0.08;
      const r = 34 * z + 12;
      g.x += (lead.x + Math.cos(a) * r - g.x) * Math.min(1, dt * 10);
      g.y += (lead.y + Math.sin(a) * r - g.y) * Math.min(1, dt * 10);
    });
    for (const g of guards) {
      if (!g.dead) continue;
      g.vy += 1500 * dt; g.y += g.vy * dt; g.rot += 6 * dt;
      if (g.y > FLOOR && !g.splashed) { g.splashed = true; sizzle(g.x); }
    }
    guards = guards.filter(g => !g.dead || g.y < H + 40);
    const sacrifice = (g, f) => {
      g.dead = true; g.vy = -140; g.x = f.x; g.y = f.y;
      f.gone = true;
      explode(f.x, f.y, true, 'Blocked!');
      blip(1400, 0.15, 'triangle', 0.08, -900);
    };

    // walls of fire sweeping forward from the dragon
    for (const w of walls) {
      w.x += w.speed * dt;
      if (state !== 'play') continue;
      const lead = birds[0], z = lead.size || 1;
      const top = lead.y - 14 * z, bot = lead.y + 20 * z;
      const inGap = top >= w.gapY - w.gapH / 2 && bot <= w.gapY + w.gapH / 2;
      // a bodyguard throws itself into the flames just ahead of you, burning an escape hole
      if (!w.used && !inGap && w.x + WALL_W > lead.x - 14 * z - 6) {
        const g = guards.find(g => !g.dead);
        if (g) {
          w.used = true;
          w.hole = { y: lead.y + 3 * z, h: 36 * z + 26 };
          g.dead = true; g.vy = -140; g.x = w.x + WALL_W / 2; g.y = lead.y;
          explode(w.x + WALL_W / 2, lead.y, true, 'Blocked!');
        }
      }
      if (w.x + WALL_W > lead.x - 14 * z && w.x < lead.x + 16 * z) {
        const inHole = w.hole && top >= w.hole.y - w.hole.h / 2 && bot <= w.hole.y + w.hole.h / 2;
        if (!inGap && !inHole) { bird = lead; roasted = true; wallDeath = true; lead.charred = true; explode(lead.x, lead.y, true, 'Roasted!'); hit(); }
      }
    }
    walls = walls.filter(w => w.x < W + 60);

    // fireballs
    for (const f of fireballs) {
      f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt;
      // a fireball that hits a geyser or stalactite blows up on it
      if (!f.gone) {
        for (const c of cols) {
          if (f.x < c.x - 6 || f.x > c.x + c.w + 6) continue;
          let hitObs = false;
          if (c.kind === 'geyser') hitObs = f.y > FLOOR - geyserH(c) - 4;
          else if (f.y < c.by) {
            const half = (c.w / 2 + 4) * (c.by - f.y) / (c.by - ROOF);
            hitObs = Math.abs(f.x - (c.x + c.w / 2)) < half + 4;
          }
          if (hitObs) { f.gone = true; explode(f.x, f.y); break; }
        }
      }
      if (state === 'play' && !f.gone) {
        // a bodyguard in the way takes the hit
        let blocked = false;
        for (const g of guards) {
          if (!g.dead && (f.x - g.x) ** 2 + (f.y - g.y) ** 2 < 16 ** 2) { sacrifice(g, f); blocked = true; break; }
        }
        // or one throws itself in front of a fireball about to hit you
        if (!blocked) {
          const lead = birds[0], z = lead.size || 1;
          if ((f.x - lead.x) ** 2 + (f.y - lead.y) ** 2 < (8 + 15 * z + 14) ** 2) {
            const g = guards.find(g => !g.dead);
            if (g) { sacrifice(g, f); blocked = true; }
          }
        }
        if (blocked) continue;
        for (const b of birds) {
          const z = b.size || 1;
          if ((f.x - b.x) ** 2 + (f.y - b.y) ** 2 < (8 + 15 * z) ** 2) { bird = b; roasted = true; b.charred = true; explode(b.x, b.y, true, 'Roasted!'); hit(); }
        }
      }
    }
    fireballs = fireballs.filter(f => !f.gone && f.x < W + 30 && f.x > -30 && f.y > -30 && f.y < H + 30);

    if (state === 'ready') {
      bird = birds[0];
      bird.y = H * 0.42 + Math.sin(time * 3) * 10;
      bird.tilt = 0;
      bird.wing = (Math.sin(time * 10) + 1) / 2;
    }

    if (state === 'play') {
      for (const b of birds) {
        b.size += (b.targetSize - b.size) * Math.min(1, dt * 4);
        b.vy = Math.min(900, b.vy + GRAVITY * dt);
        b.y += b.vy * dt;
        b.tilt = Math.max(-0.4, Math.min(0.8, b.vy / 900));
        b.wing = Math.max(b.wing, 0.35 + Math.sin(time * 24) * 0.35); // always flapping
        const z = b.size || 1;
        bird = b;
        if (b.y + 20 * z > FLOOR + 4) { toasted = true; hit(); }
        else if (b.y - 14 * z < ROOF + 6) hit();
      }

      spawnX -= speed * dt;
      if (spawnX < W + 60) {
        addColumn();
        spawnX += speed * 0.62 + 50 + Math.random() * Math.max(60, 260 - score * 2);
      }

      for (const c of cols) {
        c.x -= speed * dt;
        if (!c.passed && c.x + c.w < birds[0].x) {
          c.passed = true; score++;
          if (score % 10 === 0 && score < GOAL) {
            // milestone: the bird snaps up the butterfly and grows bigger, and a golden egg hatches a chick
            fly.caught = true;
            for (const b of birds) { b.targetSize += 0.12; b.squish = 1; }
            grow = 1.6;
            blip(330, 0.25, 'triangle', 0.12, 330);
            const lead = birds[0];
            eggs.push({ x: lead.x - 14, y: lead.y + 4, vx: -30, vy: -160, rot: 0, spin: 5, cracked: false, t: 0, baby: true, golden: true });
            // ...and a red-hot bomb egg flies back at the dragons
            eggs.push({ x: lead.x - 18, y: lead.y, vx: -110, vy: -120, rot: 0, spin: -8, cracked: false, t: 0, bomb: true });
            eggCount += 2;
          }
          blip(880, 0.09, 'square', 0.06); setTimeout(() => blip(1320, 0.12, 'square', 0.05), 70);
          speed = Math.min(560, speed + 5);
          if (score >= GOAL) { state = 'won'; overAt = performance.now() + 3400; ending = { t: 0, forest: false }; killDragons(); fly.caught = true; if (score > best) { best = score; newBest = true; saveBest(); } blip(660, 0.5, 'triangle', 0.15, 660); }
        }
        for (const b of birds) {
          bird = b;
          const z = bird.size || 1;
          const l = bird.x - 14 * z, r = bird.x + 16 * z, t = bird.y - 14 * z, btm = bird.y + 20 * z;
          if (c.kind === 'geyser') {
            const gt = FLOOR - geyserH(c) + 4;
            if (r > c.x + 4 && l < c.x + c.w - 4 && btm > gt) { toasted = true; hit(); }
          } else {
            // triangle-shaped hitbox: the spike narrows to a point at its tip
            const cx = c.x + c.w / 2;
            if (t < c.by - 4) {
              const half = (c.w / 2 + 4) * (c.by - t) / (c.by - ROOF);
              if (r > cx - half && l < cx + half) hit();
            }
          }
        }
      }
      cols = cols.filter(c => c.x > -c.w - 10);
    } else if (state === 'over') {
      for (const b of birds) {
        if (b.ash) { b.ashT += dt; continue; }
        b.vy = Math.min(900, b.vy + GRAVITY * dt);
        b.y += b.vy * dt;
        b.tilt = Math.min(1.4, b.tilt + dt * 3);
        if (b.charred && Math.random() < 0.6) feathers.push({ x: b.x + (Math.random() - 0.5) * 10, y: b.y - 10, vx: (Math.random() - 0.5) * 30, vy: -40 - Math.random() * 40, rot: 0, vr: 0, life: 0.7, col: 'rgba(70,60,65,0.8)' });
        if (b.y >= FLOOR - 4) { b.y = FLOOR - 4; b.ash = true; b.ashT = 0; b.charred = true; incinerate(b); }
      }
    }
    for (const pl of pillars) pl.t += dt;
    pillars = pillars.filter(pl => pl.t < 1);

    for (const f of feathers) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy = Math.min(60, f.vy + 220 * dt); f.vx *= 0.97; f.rot += f.vr * dt; f.life -= dt; }
    feathers = feathers.filter(f => f.life > 0);
    if (feathers.length > 220) feathers.splice(0, feathers.length - 220); // keep particle counts phone-friendly
    for (const s of slaps) s.t += dt;
    slaps = slaps.filter(s => s.t < 0.45);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  const embers = Array.from({ length: 28 }, () => ({ x: Math.random() * 400, o: Math.random() * 600, s: 20 + Math.random() * 40, r: 0.8 + Math.random() * 1.6 }));
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1018'); g.addColorStop(0.55, '#3a1c24'); g.addColorStop(1, '#8a3418');
    ctx.fillStyle = g; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY);

    // far cave walls: dark rock teeth above and below, scrolling slowly
    const far = dist * 0.15;
    ctx.fillStyle = 'rgba(12,6,10,0.55)';
    ctx.beginPath(); ctx.moveTo(-VX, -VY);
    for (let i = Math.floor((far - VX) / 45) - 1; i * 45 - far < W + VX + 45; i++) {
      const x = i * 45 - far, d = 50 + ((i * 7919) % 7) * 18;
      ctx.lineTo(x, 30); ctx.lineTo(x + 22, 30 + d);
    }
    ctx.lineTo(W + VX, -VY); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-VX, FLOOR);
    for (let i = Math.floor((far - VX) / 60) - 1; i * 60 - far < W + VX + 60; i++) {
      const x = i * 60 - far, d = 60 + ((i * 104729) % 6) * 25;
      ctx.lineTo(x, FLOOR); ctx.lineTo(x + 30, FLOOR - d);
    }
    ctx.lineTo(W + VX, FLOOR); ctx.closePath(); ctx.fill();

    // glowing embers drifting up from the lava
    for (const e of embers) {
      const y = FLOOR - ((time * e.s + e.o) % FLOOR);
      const x = (((e.x - dist * 0.3) % W) + W) % W;
      ctx.fillStyle = `rgba(255,${140 + Math.floor(y / H * 80)},60,${Math.min(1, y / FLOOR) * 0.8})`;
      ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawColumn(c) {
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const cx = c.x + c.w / 2;
    if (c.kind === 'spike') {
      // rock stalactite hanging from the ceiling
      const steps = 6;
      ctx.beginPath();
      ctx.moveTo(c.x - 4, -10);
      for (let k = 1; k <= steps; k++) {
        const f = k / steps, y = ROOF + (c.by - ROOF) * f;
        const half = (c.w / 2 + 4) * (1 - f);
        const jag = k < steps ? ((c.seed * (k + 3)) % 5) - 2 : 0;
        ctx.lineTo(cx - half + jag, y);
      }
      for (let k = steps - 1; k >= 0; k--) {
        const f = k / steps, y = ROOF + (c.by - ROOF) * f;
        const half = (c.w / 2 + 4) * (1 - f);
        const jag = ((c.seed * (k + 7)) % 5) - 2;
        ctx.lineTo(cx + half + jag, y);
      }
      ctx.lineTo(c.x + c.w + 4, -10);
      ctx.closePath();
      const rg = ctx.createLinearGradient(c.x, 0, c.x + c.w, 0);
      rg.addColorStop(0, '#a58690'); rg.addColorStop(0.5, '#7a5f6a'); rg.addColorStop(1, '#4e3a44');
      ctx.fillStyle = rg; ctx.fill();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 3; ctx.stroke();
      // ridges and a warm rim of lava light on the underside
      ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - c.w * 0.18, ROOF + 6); ctx.lineTo(cx - 2, c.by - (c.by - ROOF) * 0.25); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,150,60,0.45)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + (c.w / 2) * 0.3, ROOF + (c.by - ROOF) * 0.7); ctx.lineTo(cx, c.by - 2); ctx.stroke();
      return;
    }

    // lava geyser spitting up out of the pool
    const gh = geyserH(c), top = FLOOR - gh;
    const glow = ctx.createRadialGradient(cx, top, 4, cx, top, 60);
    glow.addColorStop(0, 'rgba(255,200,80,0.45)'); glow.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(cx, top, 60, 0, Math.PI * 2); ctx.fill();

    const edge = (y, side) => cx + side * (c.w / 2 - 3) + Math.sin((y + time * 260) * 0.08 + side * 2 + c.seed) * 3;
    ctx.beginPath();
    ctx.moveTo(edge(FLOOR + 10, -1), FLOOR + 10);
    for (let y = FLOOR + 10; y >= top + 6; y -= 8) ctx.lineTo(edge(y, -1), y);
    ctx.quadraticCurveTo(cx, top - 10, edge(top + 6, 1), top + 6);
    for (let y = top + 6; y <= FLOOR + 10; y += 8) ctx.lineTo(edge(y, 1), y);
    ctx.closePath();
    const lg = ctx.createLinearGradient(0, top, 0, FLOOR);
    lg.addColorStop(0, '#fff1a8'); lg.addColorStop(0.3, '#ffb02e'); lg.addColorStop(1, '#e2481c');
    ctx.fillStyle = lg; ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 3; ctx.stroke();
    // bright streaks rushing upward
    ctx.strokeStyle = 'rgba(255,250,210,0.75)'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      const sx = cx + (k - 1) * c.w * 0.2;
      const y0 = top + 10 + ((time * 300 + k * 40 + c.seed) % Math.max(20, gh - 10));
      ctx.beginPath(); ctx.moveTo(sx, y0); ctx.lineTo(sx, Math.min(FLOOR, y0 + 14)); ctx.stroke();
    }
    // bubbling crown at the top
    ctx.fillStyle = '#ffd36b'; ctx.lineWidth = 2;
    for (let k = -2; k <= 2; k++) {
      const r = 5 + Math.abs(Math.sin(time * 9 + k * 1.7 + c.seed)) * 4;
      ctx.beginPath(); ctx.arc(cx + k * (c.w / 6), top + 2 - (2 - Math.abs(k)) * 3, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    // spitting blobs of lava
    for (let k = 0; k < 5; k++) {
      const ph = (time * 1.4 + k * 0.21 + c.seed) % 1;
      const bx = cx + (k - 2) * 7 * ph * 2.2;
      const by = top - Math.sin(ph * Math.PI) * (36 + k * 6);
      const r = 2 + 3 * (1 - ph);
      ctx.fillStyle = ph < 0.5 ? '#ffd36b' : '#ff7a2a';
      ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5; ctx.stroke();
    }
  }

  function drawFloor() {
    // warm glow rising off the lava
    const glow = ctx.createLinearGradient(0, FLOOR - 130, 0, FLOOR);
    glow.addColorStop(0, 'rgba(255,120,40,0)'); glow.addColorStop(1, 'rgba(255,120,40,0.35)');
    ctx.fillStyle = glow; ctx.fillRect(-VX, FLOOR - 130, W + 2 * VX, 130);

    // the lava itself, with a rolling surface
    const surf = x => FLOOR + Math.sin((x + dist) * 0.05 + time * 2) * 3 + Math.sin((x + dist * 0.6) * 0.11) * 2;
    const lg = ctx.createLinearGradient(0, FLOOR - 6, 0, H);
    lg.addColorStop(0, '#ffd23f'); lg.addColorStop(0.25, '#ff8a1f'); lg.addColorStop(1, '#c42a10');
    ctx.fillStyle = lg;
    const lx0 = -VX - 8, lx1 = W + VX + 8;
    ctx.beginPath(); ctx.moveTo(lx0, H + VY);
    for (let x = lx0; x <= lx1; x += 8) ctx.lineTo(x, surf(x));
    ctx.lineTo(lx1, H + VY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 3;
    ctx.beginPath();
    for (let x = lx0; x <= lx1; x += 8) { if (x > lx0) ctx.lineTo(x, surf(x)); else ctx.moveTo(x, surf(x)); }
    ctx.stroke();

    // bright crust swirls drifting by
    ctx.strokeStyle = 'rgba(255,240,170,0.7)'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const x = ((i * 90 - dist * 0.9) % (W + 90) + W + 90) % (W + 90) - 45;
      ctx.beginPath(); ctx.ellipse(x, FLOOR + 22 + (i % 3) * 10, 14, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    }
    // bubbles popping on the surface
    for (let i = 0; i < 6; i++) {
      const ph = (time * 0.8 + i * 0.37) % 1;
      const x = ((i * 83 + 40 - dist * 0.95) % W + W) % W;
      ctx.fillStyle = `rgba(255,225,130,${1 - ph})`;
      ctx.beginPath(); ctx.arc(x, FLOOR - ph * 4, 2 + ph * 5, Math.PI, 0); ctx.fill();
    }

    // rocky cave ceiling with stalactite teeth
    ctx.fillStyle = '#2b1e26';
    ctx.beginPath(); ctx.moveTo(-VX - 20, -VY - 10);
    for (let i = Math.floor((dist - VX) / 20) - 1; i * 20 - dist < W + VX + 20; i++) {
      const x = i * 20 - dist, d = 6 + ((i * 7919) % 5) * 3;
      ctx.lineTo(x, ROOF - 4); ctx.lineTo(x + 10, ROOF + d);
    }
    ctx.lineTo(W + VX + 20, -VY - 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = 'rgba(255,140,60,0.18)';
    ctx.fillRect(-VX, ROOF - 10, W + 2 * VX, 8); // warm lava light catching the underside of the rock
  }

  // a roasted bird is drawn charred black; once it hits the lava it shrinks away to nothing
  function drawBird(scale = 1) {
    if (bird.ash && bird.ashT > 0.5) return;
    if (!bird.charred && !bird.ash) return drawBirdInner(scale);
    const keep = { body: C.body, bodyDark: C.bodyDark, belly: C.belly, beak: C.beak };
    Object.assign(C, { body: '#3a2e30', bodyDark: '#1f181a', belly: '#5a3a30', beak: '#4a3a30' });
    drawBirdInner(bird.ash ? scale * Math.max(0.05, 1 - bird.ashT / 0.5) : scale);
    Object.assign(C, keep);
  }

  function drawBirdInner(scale = 1) {
    const { x, y, squish, tilt, wing } = bird;
    ctx.save();
    ctx.translate(x, y);
    const sz = (bird.size || 1) * scale;
    ctx.scale(sz, sz);
    ctx.rotate(tilt * 0.7);
    const sx = 1 + squish * 0.2, sy = 1 - squish * 0.22;
    ctx.scale(sx, sy);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const dead = state === 'over';

    // running legs
    for (const [lx, ph] of [[-4, 0], [4, Math.PI]]) {
      const sw = -5 + Math.sin(time * 20 + ph) * 1.5; // tucked back in flight
      ctx.strokeStyle = C.outline; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(lx, 11); ctx.lineTo(lx + sw, 21); ctx.lineTo(lx + sw + 4.5, 21.5); ctx.stroke();
      ctx.strokeStyle = '#f0a03c'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(lx, 11); ctx.lineTo(lx + sw, 21); ctx.lineTo(lx + sw + 4.5, 21.5); ctx.stroke();
    }
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.outline;

    // tail
    ctx.fillStyle = C.bodyDark;
    ctx.beginPath(); ctx.moveTo(-14, -2); ctx.lineTo(-26, -9); ctx.lineTo(-24, 0); ctx.lineTo(-27, 7); ctx.lineTo(-13, 5); ctx.closePath();
    ctx.fill(); ctx.stroke();

    // body and belly
    ctx.fillStyle = C.body;
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = C.belly; ctx.beginPath(); ctx.ellipse(6, 8, 13, 10, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, 18, 15, 0, 0, Math.PI * 2); ctx.stroke();

    // red handprint where it got slapped
    if (bird.mark > 0) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, bird.mark) * 0.75;
      ctx.fillStyle = '#d63c3c';
      ctx.translate(-1, 7); ctx.rotate(-0.2);
      ctx.beginPath(); ctx.ellipse(0, 2, 5, 4, 0, 0, Math.PI * 2); ctx.fill();
      for (const [fx, fl] of [[-4, 5], [-1.3, 6], [1.3, 6], [4, 4.5]]) {
        ctx.beginPath(); ctx.ellipse(fx, -2 - fl / 2, 1.1, fl / 2, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }

    // crest
    ctx.fillStyle = C.bodyDark;
    ctx.beginPath(); ctx.moveTo(2, -13); ctx.quadraticCurveTo(-2, -24, 6, -21); ctx.quadraticCurveTo(6, -17, 8, -13); ctx.closePath();
    ctx.fill(); ctx.stroke();

    // beak snaps open and shut while chasing the butterfly
    ctx.fillStyle = C.beak;
    if (state === 'play' && Math.sin(time * 16) > 0.2) {
      ctx.fillStyle = '#7a2b3a';
      ctx.beginPath(); ctx.moveTo(15, -3); ctx.lineTo(25, -5); ctx.lineTo(24, 5); ctx.lineTo(15, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.beak;
      ctx.beginPath(); ctx.moveTo(15, -5); ctx.lineTo(27, -5); ctx.lineTo(15, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(15, 1); ctx.lineTo(25, 5); ctx.lineTo(15, 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(15, -4); ctx.lineTo(26, 0); ctx.lineTo(15, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    // eye, following the dragon
    ctx.lineWidth = 2;
    if (dead) {
      ctx.beginPath(); ctx.moveTo(6, -8); ctx.lineTo(12, -2); ctx.moveTo(12, -8); ctx.lineTo(6, -2); ctx.stroke();
    } else if (wince > 0) {
      ctx.beginPath(); ctx.moveTo(6, -8); ctx.lineTo(11, -5); ctx.lineTo(6, -2); ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(9, -5, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      const prey = !fly.eaten ? fly : (bugs.find(b => !b.dead) || bug);
      const ang = Math.atan2(prey.y - bird.y, prey.x - bird.x) - bird.tilt * 0.7;
      ctx.fillStyle = C.outline; ctx.beginPath(); ctx.arc(9 + Math.cos(ang) * 2, -5 + Math.sin(ang) * 2, 2, 0, Math.PI * 2); ctx.fill();
    }

    // wing (flips up when slapped)
    ctx.lineWidth = 2.5;
    ctx.fillStyle = C.bodyDark;
    ctx.save();
    ctx.translate(-3, 1);
    ctx.rotate(-0.2 - wing * 1.1);
    ctx.beginPath(); ctx.ellipse(-4, 0, 11, 6.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // flames licking off a roasted bird
    if (bird.charred && !bird.ash) {
      for (let k = 0; k < 3; k++) {
        const fx = -8 + k * 8, fh = 12 + Math.sin(time * 20 + k * 2) * 4;
        ctx.fillStyle = k % 2 ? '#ffb02e' : '#ff6a2a';
        ctx.beginPath(); ctx.moveTo(fx - 5, -9); ctx.quadraticCurveTo(fx - 4, -9 - fh * 0.6, fx, -9 - fh); ctx.quadraticCurveTo(fx + 4, -9 - fh * 0.6, fx + 5, -9); ctx.closePath(); ctx.fill();
      }
    }

    ctx.restore();
  }

  function drawHand(s) {
    const bird = s.b;
    // open palm swoops up from below, hits, then drops away
    const p = s.t / 0.45;
    const rise = p < 0.3 ? p / 0.3 : 1;
    const fall = p < 0.3 ? 0 : (p - 0.3) / 0.7;
    // the hand tracks the bird so the palm lands right on its underside
    const hx = bird.x - 4 - 38 * (1 - rise) - 14 * fall;
    const hy = bird.y + 30 + 46 * (1 - rise) + 34 * fall;
    ctx.save();
    ctx.globalAlpha = 1 - fall;
    ctx.translate(hx, hy);
    ctx.rotate(-0.2 - 0.7 * (1 - rise));
    ctx.fillStyle = C.skin; ctx.strokeStyle = C.outline; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    // fingers (pointing up)
    const fingers = [[-10, -14, 4.5, 11], [-3, -17, 4.5, 13], [4, -16, 4.5, 12], [11, -12, 4, 9]];
    for (const [fx, fy, rx, ry] of fingers) { ctx.beginPath(); ctx.ellipse(fx, fy, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    // thumb
    ctx.beginPath(); ctx.ellipse(-17, 4, 4.5, 9, -0.9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // palm
    roundRect(-15, -8, 30, 24, 9); ctx.fill(); ctx.stroke();
    // cuff
    ctx.fillStyle = '#e2574c';
    roundRect(-13, 14, 26, 12, 3); ctx.fill(); ctx.stroke();
    ctx.restore();

    // impact burst + word
    if (p > 0.18 && p < 0.85) {
      const q = (p - 0.18) / 0.67;
      ctx.save();
      ctx.globalAlpha = 1 - q;
      ctx.translate(bird.x, bird.y);
      ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 7; i++) {
        const a = (i / 6) * Math.PI;
        const r1 = 14 + q * 8, r2 = 22 + q * 14;
        ctx.beginPath(); ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1 + 14); ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2 + 14); ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.globalAlpha = 1 - q;
      outlinedText(s.word, bird.x + 46, bird.y + 6 - q * 18, 22, C.gold, 800, -0.15);
      ctx.restore();
    }
  }

  function drawEggs() {
    for (const e of eggs) {
      ctx.save();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
      if (e.splatted) {
        // broken shell tumbling down, dripping yolk
        ctx.translate(e.x, e.y); ctx.rotate(e.rot);
        ctx.fillStyle = '#fff3dc';
        for (const side of [-1, 1]) {
          ctx.save(); ctx.translate(side * 5, 0); ctx.rotate(side * 0.5);
          ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-3, -3); ctx.lineTo(-1, -1); ctx.lineTo(1, -4); ctx.lineTo(3, -1); ctx.lineTo(5, -3); ctx.lineTo(5, 0);
          ctx.quadraticCurveTo(0, 6, -5, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
        ctx.fillStyle = '#ffb627';
        ctx.beginPath(); ctx.arc(0, 4, 2.5, 0, Math.PI * 2); ctx.fill();
      } else if (!e.cracked) {
        ctx.translate(e.x, e.y); ctx.rotate(e.rot);
        if (e.small) ctx.scale(0.7, 0.7);
        ctx.fillStyle = e.stinkEgg ? '#a9c25e' : e.guardEgg ? '#fde7a0' : e.bomb ? '#ff5a3c' : e.golden ? '#ffd36b' : '#fff3dc';
        ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 8.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#c9a98a';
        ctx.beginPath(); ctx.arc(-2, -3, 1.1, 0, Math.PI * 2); ctx.arc(2.5, 1, 0.9, 0, Math.PI * 2); ctx.arc(-1, 4, 0.8, 0, Math.PI * 2); ctx.fill();
      } else if (e.baby) {
        // open shell left behind after hatching
        ctx.translate(e.x, FLOOR - 4);
        ctx.fillStyle = '#fff3dc';
        ctx.beginPath(); ctx.moveTo(-7, -2); ctx.lineTo(-5, -5); ctx.lineTo(-2, -2); ctx.lineTo(0, -6); ctx.lineTo(2, -2); ctx.lineTo(5, -5); ctx.lineTo(7, -2);
        ctx.ellipse(0, -2, 7, 7, 0, 0, Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
      } else {
        const spread = Math.min(1, e.t * 8);
        ctx.translate(e.x, FLOOR + 6);
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath(); ctx.ellipse(0, 0, 6 + 9 * spread, 2 + 2 * spread, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffb627';
        ctx.beginPath(); ctx.arc(1, -1, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.beginPath(); ctx.arc(-0.5, -2.5, 1.3, 0, Math.PI * 2); ctx.fill();
        // shell halves
        ctx.fillStyle = '#fff3dc';
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.translate(side * (11 + 4 * spread), -3); ctx.rotate(side * 0.6);
          ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(-3, -3); ctx.lineTo(-1, -1); ctx.lineTo(1, -4); ctx.lineTo(3, -1); ctx.lineTo(5, -3); ctx.lineTo(5, 0);
          ctx.quadraticCurveTo(0, 6, -5, 0); ctx.closePath(); ctx.fill(); ctx.lineWidth = 1.5; ctx.stroke();
          ctx.restore();
        }
      }
      ctx.restore();
    }
  }

  function drawChicks() {
    // the hatchlings are baby birds: tiny copies of the main one
    const saved = bird;
    for (const c of chicks) {
      bird = { x: c.x, y: c.y, squish: c.t < 0.3 ? 1 - c.t / 0.3 : 0, tilt: c.tilt || 0, wing: c.wing || 0, mark: 0, size: 1 };
      ctx.save(); ctx.globalAlpha = Math.min(1, c.t * 4 + 0.2);
      drawBird(0.55);
      ctx.restore();
      if (c.t < 1.2) {
        ctx.save(); ctx.globalAlpha = Math.min(1, (1.2 - c.t) * 3);
        outlinedText('peep!', c.x + 14, c.y - 22, 14, '#ffe066', 800, 0.1);
        ctx.restore();
      }
    }
    bird = saved;
  }
  function drawBug(d, i) {
    // a fierce red dragon chasing the bird
    ctx.save();
    ctx.translate(d.x, d.y);
    ctx.rotate(d.dead ? d.rot : Math.sin(d.t * 3) * 0.08);
    ctx.scale(1.45, 1.45);
    ctx.strokeStyle = C.outline; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const flap = Math.sin(d.t * 14);
    const PAL = DRAGON_COLORS[d.col || 0];
    const BODY = PAL.body, DARK = PAL.dark, BELLY = PAL.belly, WING = PAL.wing;
    const wingAt = (wx, wy, col) => {
      ctx.save(); ctx.translate(wx, wy); ctx.rotate(0.2 - flap * 0.6);
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-2, -20);
      ctx.quadraticCurveTo(-7, -12, -11, -15);
      ctx.quadraticCurveTo(-12, -8, -18, -9);
      ctx.quadraticCurveTo(-10, -2, 0, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    };

    // spiky tail
    ctx.beginPath(); ctx.moveTo(-9, 2); ctx.bezierCurveTo(-18, 6 + flap * 2, -22, -4, -29, -2);
    ctx.lineWidth = 5.5; ctx.stroke(); ctx.strokeStyle = BODY; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = C.outline; ctx.lineWidth = 2;
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.moveTo(-28, -2); ctx.lineTo(-35, -7); ctx.lineTo(-33, 2); ctx.closePath(); ctx.fill(); ctx.stroke();

    wingAt(-3, -5, WING);

    // body, belly and back spines
    ctx.fillStyle = DARK;
    for (const sx of [-8, -3, 2]) { ctx.beginPath(); ctx.moveTo(sx - 2.5, -7); ctx.lineTo(sx, -12); ctx.lineTo(sx + 2.5, -7); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = BODY;
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 8.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 12, 8.5, 0, 0, Math.PI * 2); ctx.clip();
    ctx.fillStyle = BELLY; ctx.beginPath(); ctx.ellipse(2, 7, 10, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.ellipse(0, 0, 12, 8.5, 0, 0, Math.PI * 2); ctx.stroke();

    // clawed legs
    ctx.fillStyle = BODY;
    for (const lx of [-5, 4]) {
      ctx.beginPath(); ctx.ellipse(lx, 8.5, 2.8, 2.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(lx - 1.5, 10.5); ctx.lineTo(lx - 1, 12.5); ctx.moveTo(lx + 1.5, 10.5); ctx.lineTo(lx + 2, 12.5); ctx.stroke();
    }

    // neck
    ctx.fillStyle = BODY;
    ctx.beginPath(); ctx.moveTo(5, -4); ctx.quadraticCurveTo(9, -12, 13, -13); ctx.lineTo(16, -7); ctx.quadraticCurveTo(12, -2, 9, 2); ctx.closePath(); ctx.fill(); ctx.stroke();

    // long swept-back horns
    ctx.fillStyle = '#f3e3c3';
    ctx.beginPath(); ctx.moveTo(11, -16); ctx.quadraticCurveTo(6, -21, 3, -26); ctx.quadraticCurveTo(9, -22, 14, -18); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -18); ctx.quadraticCurveTo(12, -24, 10, -29); ctx.quadraticCurveTo(16, -24, 18, -18); ctx.closePath(); ctx.fill(); ctx.stroke();

    // head
    ctx.fillStyle = BODY;
    ctx.beginPath(); ctx.ellipse(15, -13, 7.5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // jaws: the lower jaw drops open when it roars
    const open = d.roar > 0 ? 0.55 : 0.1;
    ctx.save(); ctx.translate(17, -9); ctx.rotate(open);
    ctx.fillStyle = DARK;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, 1); ctx.quadraticCurveTo(10, 4, 0, 4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const tx of [3, 6.5]) { ctx.beginPath(); ctx.moveTo(tx, 0.5); ctx.lineTo(tx + 1.2, -2); ctx.lineTo(tx + 2.4, 0.7); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    ctx.fillStyle = BODY;
    ctx.beginPath(); ctx.moveTo(15, -15); ctx.lineTo(27, -12); ctx.quadraticCurveTo(28, -8, 25, -8.5); ctx.lineTo(16, -8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    for (const tx of [19, 22.5]) { ctx.beginPath(); ctx.moveTo(tx, -8.4); ctx.lineTo(tx + 1.2, -6); ctx.lineTo(tx + 2.4, -8.5); ctx.closePath(); ctx.fill(); }
    if (d.roar > 0) {
      // flames in its mouth
      ctx.fillStyle = '#ffb02e';
      ctx.beginPath(); ctx.ellipse(26, -6, 4, 2.5, 0.3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = C.outline;
    ctx.beginPath(); ctx.arc(25.5, -11.5, 0.9, 0, Math.PI * 2); ctx.fill();

    // angry eye with a heavy brow
    if (d.dead) {
      ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(12, -17); ctx.lineTo(16, -13); ctx.moveTo(16, -17); ctx.lineTo(12, -13); ctx.stroke();
    } else {
      ctx.fillStyle = '#ffe14d';
      ctx.beginPath(); ctx.ellipse(14.5, -14.5, 2.8, 2.4, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = C.outline;
      ctx.beginPath(); ctx.ellipse(15.3, -14.5, 0.8, 2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(11, -18.8); ctx.lineTo(18, -16); ctx.stroke();
    }
    ctx.lineWidth = 2;

    // smoke curling from its nostril
    if (!d.dead && d.roar <= 0) {
      ctx.fillStyle = 'rgba(120,110,115,0.5)';
      for (let k = 0; k < 3; k++) {
        const ph = (d.t * 1.2 + k / 3) % 1;
        ctx.beginPath(); ctx.arc(27 + ph * 6, -12 - ph * 10, 1 + ph * 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // egg dripping down its face
    if (d.splat > 0 && !d.dead) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.splat * 5);
      const drip = (0.5 - d.splat) * 14;
      ctx.fillStyle = '#fff7ea'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(9, -16); ctx.quadraticCurveTo(12, -21, 17, -19); ctx.quadraticCurveTo(23, -19, 22, -14);
      ctx.quadraticCurveTo(22, -9 + drip, 20, -8 + drip); ctx.quadraticCurveTo(18, -11, 16, -9 + drip * 0.6);
      ctx.quadraticCurveTo(12, -10, 10, -12); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#ffb627';
      ctx.beginPath(); ctx.arc(15.5, -15, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(14.5, -16, 1, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // glowing lava goo dripping off its face
    if (d.lava > 0 && !d.dead) {
      ctx.save(); ctx.globalAlpha = Math.min(1, d.lava * 2.5);
      const drip = (1 - d.lava) * 8;
      ctx.fillStyle = '#ff8a1f'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(9, -17); ctx.quadraticCurveTo(14, -23, 20, -19); ctx.quadraticCurveTo(25, -16, 22, -12);
      ctx.quadraticCurveTo(21, -7 + drip, 19, -6 + drip); ctx.quadraticCurveTo(17, -10, 14, -8 + drip * 0.7);
      ctx.quadraticCurveTo(10, -11, 9, -17); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#fff3b0'; ctx.beginPath(); ctx.arc(15, -16, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // green stink lines when the stench gets to it
    if (d.stink > 0 && !d.dead) {
      ctx.save(); ctx.globalAlpha = Math.min(1, d.stink * 2);
      ctx.strokeStyle = 'rgba(120,180,60,0.9)'; ctx.lineWidth = 1.4;
      for (const sx of [8, 16, 24]) {
        ctx.beginPath();
        for (let k = 0; k <= 6; k++) {
          const yy = -18 - k * 2.5, xx = sx + Math.sin(k * 1.2 + time * 8 + sx) * 1.8;
          if (k) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // dizzy stars when a chick's egg has stunned it
    if (d.stun > 0 && !d.dead) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, d.stun * 3);
      ctx.fillStyle = '#ffe066'; ctx.lineWidth = 1;
      for (let k = 0; k < 3; k++) {
        const a = time * 6 + k * 2.09;
        const sx = 15 + Math.cos(a) * 11, sy = -25 + Math.sin(a) * 3.5;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 ? 1 : 2.6, an = i * Math.PI / 5 - Math.PI / 2;
          ctx.lineTo(sx + Math.cos(an) * r, sy + Math.sin(an) * r);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }

    wingAt(1, -6, DARK);
    ctx.restore();

    if (d.stink > 0.5 && !d.dead) outlinedText('Pee-yew!', d.x + 36, d.y - 62 - (1.3 - d.stink) * 30, 16, '#b8f28a', 800, -0.1);
    if (d.splat > 0 && !d.dead) outlinedText('Splat!', d.x + 30, d.y - 46 - (0.5 - d.splat) * 40, 16, '#ffe066', 800, 0.1);

    if (i === 0 && state === 'over' && !d.dead && performance.now() - overAt > 300) {
      outlinedText('ROAR!', d.x + 30, d.y - 52, 18, '#ff8a5c', 800, -0.1);
    }
  }

  function drawFly() {
    if (fly.eaten) return;
    const wingCols = [['#b07ce8', '#7fd1e8'], ['#ff9fb5', '#ffd36b'], ['#7fe0a8', '#5fa8ff']][fly.hue];
    ctx.save();
    ctx.translate(fly.x, fly.y);
    ctx.scale(1.5, 1.5);
    ctx.rotate(Math.sin(fly.t * 2) * 0.15 - 0.2);
    ctx.strokeStyle = C.outline; ctx.lineWidth = 1.6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    const flap = 0.25 + Math.abs(Math.sin(fly.t * 16)) * 0.75; // wings fold and open
    for (const [col, uy, ry, rx, sy] of [[wingCols[1], 4, 5, 6, 1], [wingCols[0], -5, 8, 9, -1]]) {
      ctx.save(); ctx.scale(flap, 1);
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(-rx * 0.6, uy, rx, ry, sy * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(rx * 0.6, uy, rx, ry, -sy * 0.4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.beginPath(); ctx.arc(-rx * 0.7, uy - sy, 1.6, 0, Math.PI * 2); ctx.arc(rx * 0.7, uy - sy, 1.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // body and antennae
    ctx.fillStyle = '#3a2230';
    ctx.beginPath(); ctx.ellipse(0, 0, 1.8, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-0.5, -7); ctx.quadraticCurveTo(-3, -13, -5, -13); ctx.moveTo(0.5, -7); ctx.quadraticCurveTo(3, -13, 5, -13); ctx.stroke();
    ctx.restore();
  }

  function drawGuards() {
    // small golden bodyguard birds; a fallen one is charred black
    const saved = bird;
    const keep = { body: C.body, bodyDark: C.bodyDark, belly: C.belly, beak: C.beak };
    for (const g of guards) {
      Object.assign(C, g.dead
        ? { body: '#3a2e30', bodyDark: '#1f181a', belly: '#5a3a30', beak: '#4a3a30' }
        : { body: '#f2c14e', bodyDark: '#c8902a', belly: '#fff3c4', beak: '#f08a5d' });
      bird = { x: g.x, y: g.y, squish: 0, tilt: g.dead ? g.rot : 0.1, wing: 0.35 + Math.sin(time * 26 + g.seed) * 0.35, mark: 0, size: 1, charred: g.dead };
      if (!g.dead) {
        ctx.fillStyle = 'rgba(255,230,140,0.25)';
        ctx.beginPath(); ctx.arc(g.x, g.y, 15, 0, Math.PI * 2); ctx.fill();
      }
      drawBirdInner(0.45 * Math.min(1, 0.3 + (g.hatch || 0) * 3)); // newly hatched ones pop up to full size
    }
    Object.assign(C, keep);
    bird = saved;
  }

  // the solid parts of a wall: everything except its gap (and a bodyguard's hole)
  function wallSegments(w) {
    const cuts = [[w.gapY - w.gapH / 2, w.gapY + w.gapH / 2]];
    if (w.hole) cuts.push([w.hole.y - w.hole.h / 2, w.hole.y + w.hole.h / 2]);
    cuts.sort((a, b) => a[0] - b[0]);
    const segs = []; let y = ROOF - 10;
    for (const [a, b] of cuts) { if (a > y) segs.push([y, a]); y = Math.max(y, b); }
    if (y < FLOOR + 10) segs.push([y, FLOOR + 10]);
    return segs;
  }

  function drawWalls() {
    // fireball wind-up: a glow building in the dragon's mouth and a target mark where it's aiming
    for (const d of bugs) {
      if (!d.aim || d.dead) continue;
      const PAL = DRAGON_COLORS[d.col || 0];
      const k = Math.max(0, Math.min(1, 1 - d.fcharge / FIRE_CHARGE)); // stays 0..1 even when a stun stretches the wind-up
      ctx.save();
      const glow = ctx.createRadialGradient(d.x + 36, d.y - 12, 2, d.x + 36, d.y - 12, 8 + k * 16);
      glow.addColorStop(0, PAL.core); glow.addColorStop(0.5, PAL.mid); glow.addColorStop(1, `rgba(${PAL.trail},0)`);
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(d.x + 36, d.y - 12, 8 + k * 16, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5 + 0.4 * Math.abs(Math.sin(time * 20));
      ctx.strokeStyle = PAL.mid; ctx.lineWidth = 2.5;
      const r = 16 - k * 6;
      ctx.beginPath(); ctx.arc(d.aim.x, d.aim.y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(d.aim.x - r - 5, d.aim.y); ctx.lineTo(d.aim.x - r + 4, d.aim.y);
      ctx.moveTo(d.aim.x + r - 4, d.aim.y); ctx.lineTo(d.aim.x + r + 5, d.aim.y);
      ctx.moveTo(d.aim.x, d.aim.y - r - 5); ctx.lineTo(d.aim.x, d.aim.y - r + 4);
      ctx.moveTo(d.aim.x, d.aim.y + r - 4); ctx.lineTo(d.aim.x, d.aim.y + r + 5);
      ctx.stroke();
      ctx.restore();
    }
    // warning: while the dragon charges up, the coming gap is marked with flickering lines
    for (const d of bugs) {
      if (!d.plan || d.dead) continue;
      const PAL = DRAGON_COLORS[d.col || 0];
      const k = Math.max(0, Math.min(1, 1 - d.charge / WALL_CHARGE));
      ctx.save();
      const glow = ctx.createRadialGradient(d.x + 36, d.y - 12, 2, d.x + 36, d.y - 12, 14 + k * 26);
      glow.addColorStop(0, PAL.core); glow.addColorStop(0.5, PAL.mid); glow.addColorStop(1, `rgba(${PAL.trail},0)`);
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(d.x + 36, d.y - 12, 14 + k * 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.35 + 0.35 * Math.abs(Math.sin(time * 18));
      ctx.strokeStyle = PAL.mid; ctx.lineWidth = 3; ctx.setLineDash([10, 8]);
      for (const yy of [d.plan.gapY - d.plan.gapH / 2, d.plan.gapY + d.plan.gapH / 2]) {
        ctx.beginPath(); ctx.moveTo(d.x + 30, yy); ctx.lineTo(birds[0].x + 70, yy); ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.restore();
    }
    for (const w of walls) {
      const PAL = DRAGON_COLORS[w.col || 0];
      const x0 = w.x, x1 = w.x + WALL_W;
      ctx.save();
      // heat glow around the wall
      ctx.fillStyle = `rgba(${PAL.trail},0.18)`;
      for (const [a, b] of wallSegments(w)) ctx.fillRect(x0 - 14, a, WALL_W + 28, b - a);
      const g = ctx.createLinearGradient(x0, 0, x1, 0);
      g.addColorStop(0, `rgba(${PAL.trail},0.6)`); g.addColorStop(0.35, PAL.mid); g.addColorStop(0.5, PAL.core); g.addColorStop(0.65, PAL.mid); g.addColorStop(1, `rgba(${PAL.trail},0.6)`);
      ctx.fillStyle = g;
      for (const [a, b] of wallSegments(w)) {
        ctx.beginPath();
        ctx.moveTo(x0 + 3, a);
        for (let y = a; y <= b; y += 8) ctx.lineTo(x0 + 3 + Math.sin(y * 0.15 + time * 22) * 4, y);
        ctx.lineTo(x0 + 3, b);
        for (let y = b; y >= a; y -= 8) ctx.lineTo(x1 - 3 + Math.sin(y * 0.13 + time * 19) * 4, y);
        ctx.closePath(); ctx.fill();
        // flame tongues licking into the gap
        ctx.fillStyle = PAL.mid;
        for (const [edge, dir] of [[a, -1], [b, 1]]) {
          if (edge <= ROOF || edge >= FLOOR) continue;
          for (let k = 0; k < 3; k++) {
            const fx = x0 + 5 + k * 9, fh = 6 + Math.abs(Math.sin(time * 25 + k * 2)) * 7;
            ctx.beginPath(); ctx.moveTo(fx - 4, edge); ctx.quadraticCurveTo(fx, edge + dir * fh * 1.4, fx + 4, edge); ctx.closePath(); ctx.fill();
          }
        }
        ctx.fillStyle = g;
      }
      ctx.restore();
    }
  }

  // ---- the ending: daylight at the cave's mouth, then a sunny forest ----
  const hsh = i => { const v = Math.sin(i * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
  function drawSideShade() {
    if (VX < 1 || (ending && ending.forest)) return;
    for (const [edge, out] of [[0, -VX], [W, W + VX]]) {
      const g = ctx.createLinearGradient(edge, 0, out, 0);
      g.addColorStop(0, 'rgba(18,10,16,0)');
      g.addColorStop(Math.min(1, 50 / VX), 'rgba(18,10,16,0.94)');
      g.addColorStop(1, 'rgba(18,10,16,0.94)');
      ctx.fillStyle = g; ctx.fillRect(Math.min(edge, out), -VY, VX, H + 2 * VY);
    }
  }

  function drawEndingFx() {
    const t = ending.t;
    if (!ending.forest) {
      // light pouring in from the cave's mouth ahead
      const k = Math.min(1, t / 2);
      const r = 80 + k * 520;
      const g = ctx.createRadialGradient(W + 30, H * 0.42, 10, W + 30, H * 0.42, r);
      g.addColorStop(0, 'rgba(255,255,240,1)'); g.addColorStop(0.4, `rgba(255,245,200,${0.2 + 0.7 * k})`); g.addColorStop(1, 'rgba(255,240,190,0)');
      ctx.fillStyle = g; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY);
    }
    // a white flash as the bird bursts out into the daylight
    const fl = Math.max(0, 1 - Math.abs(t - 2) / 0.6);
    if (fl > 0) { ctx.fillStyle = `rgba(255,255,250,${fl})`; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY); }
  }

  function drawForest() {
    // sky, sun and soft light rays
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#7cc6f2'); g.addColorStop(0.55, '#cfeefa'); g.addColorStop(1, '#fff3cf');
    ctx.fillStyle = g; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY);
    const sg = ctx.createRadialGradient(310, 110, 10, 310, 110, 190);
    sg.addColorStop(0, 'rgba(255,252,220,1)'); sg.addColorStop(0.22, 'rgba(255,240,180,0.75)'); sg.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(310, 110, 190, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = '#fffbe0';
    for (let k = 0; k < 5; k++) {
      const a = Math.PI * 0.58 + k * 0.08 + Math.sin(time * 0.4 + k) * 0.01;
      ctx.beginPath(); ctx.moveTo(310, 110);
      ctx.lineTo(310 + Math.cos(a) * 800, 110 + Math.sin(a) * 800);
      ctx.lineTo(310 + Math.cos(a + 0.035) * 800, 110 + Math.sin(a + 0.035) * 800);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // drifting clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let k = 0; k < 4; k++) {
      const cx = ((k * 130 - dist * 0.05) % (W + 160) + W + 160) % (W + 160) - 80, cy = 50 + (k * 37) % 90;
      ctx.beginPath(); ctx.ellipse(cx, cy, 34, 12, 0, 0, Math.PI * 2); ctx.ellipse(cx + 20, cy - 8, 22, 13, 0, 0, Math.PI * 2); ctx.ellipse(cx - 18, cy - 4, 18, 10, 0, 0, Math.PI * 2); ctx.fill();
    }
    // rolling hills
    const hills = (col, base, amp, par, fr) => {
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-VX - 10, H + VY);
      for (let x = -VX - 10; x <= W + VX + 10; x += 10) { const wx = x + dist * par; ctx.lineTo(x, base - Math.sin(wx * fr) * amp - Math.sin(wx * fr * 2.3 + 1) * amp * 0.4); }
      ctx.lineTo(W + VX + 10, H + VY); ctx.closePath(); ctx.fill();
    };
    hills('#b6cfe8', 380, 30, 0.08, 0.012);
    hills('#9bcfa2', 430, 24, 0.18, 0.017);
    // distant tree line
    const p1 = dist * 0.3;
    for (let i = Math.floor((p1 - VX) / 30) - 2; i * 30 - p1 < W + VX + 40; i++) {
      const x = i * 30 - p1, r = 18 + hsh(i) * 10;
      ctx.fillStyle = hsh(i + 7) > 0.5 ? '#5fa86a' : '#6db877';
      ctx.beginPath(); ctx.arc(x, 470 - r * 0.6, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#5fa86a'; ctx.fillRect(-VX, 466, W + 2 * VX, 30);
    // bigger trees closer by
    const p2 = dist * 0.6;
    ctx.lineWidth = 2.5; ctx.strokeStyle = C.outline;
    for (let i = Math.floor((p2 - VX) / 120) - 2; i * 120 - p2 < W + VX + 120; i++) {
      const x = i * 120 - p2 + hsh(i) * 40, top = 360 + hsh(i + 3) * 70, s = 0.8 + hsh(i + 5) * 0.5;
      ctx.fillStyle = '#7a5236';
      ctx.fillRect(x - 6 * s, top + 20, 12 * s, 560 - top);
      ctx.strokeRect(x - 6 * s, top + 20, 12 * s, 560 - top);
      for (const [ox, oy, r, col] of [[-20, 10, 26, '#4c9a55'], [20, 12, 24, '#4c9a55'], [0, -12, 32, '#5fb565'], [-8, -22, 14, '#7ed07f']]) {
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + ox * s, top + oy * s, r * s, 0, Math.PI * 2); ctx.fill();
      }
    }
    // sunny meadow with flowers
    const mg = ctx.createLinearGradient(0, 540, 0, H);
    mg.addColorStop(0, '#8fd876'); mg.addColorStop(1, '#5fae4f');
    ctx.fillStyle = mg; ctx.beginPath(); ctx.moveTo(-VX - 10, H + VY);
    for (let x = -VX - 10; x <= W + VX + 10; x += 10) ctx.lineTo(x, 548 + Math.sin((x + dist) * 0.02) * 6);
    ctx.lineTo(W + VX + 10, H + VY); ctx.closePath(); ctx.fill();
    const p3 = dist;
    const petals = ['#ff8fb1', '#ffe066', '#ffffff', '#c49bff'];
    for (let i = Math.floor((p3 - VX) / 24) - 2; i * 24 - p3 < W + VX + 24; i++) {
      const x = i * 24 - p3 + hsh(i) * 14, y = 566 + hsh(i + 11) * 60, col = petals[Math.floor(hsh(i + 2) * 4)];
      ctx.fillStyle = col;
      for (let k = 0; k < 5; k++) { const a = k * 1.256; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 3, y + Math.sin(a) * 3, 2.4, 0, Math.PI * 2); ctx.fill(); }
      ctx.fillStyle = '#f5a623'; ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    // floating pollen sparkles
    for (let k = 0; k < 18; k++) {
      const x = ((hsh(k) * W - dist * 0.4) % W + W) % W, y = 120 + ((hsh(k + 40) * 400 + time * 14) % 400);
      ctx.fillStyle = `rgba(255,250,200,${0.5 + 0.4 * Math.sin(time * 3 + k)})`;
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawFireballs() {
    for (const f of fireballs) {
      const ang = Math.atan2(f.vy, f.vx);
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(ang);
      const PAL = DRAGON_COLORS[f.col || 0];
      for (let k = 5; k >= 1; k--) {
        ctx.fillStyle = `rgba(${PAL.trail},${0.5 - k * 0.07})`;
        ctx.beginPath(); ctx.arc(-k * 6, Math.sin(time * 30 + k) * 1.5, 8 - k, 0, Math.PI * 2); ctx.fill();
      }
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, 10);
      g.addColorStop(0, PAL.core); g.addColorStop(0.4, PAL.mid); g.addColorStop(1, `rgba(${PAL.trail},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  function heart(x, y, sz) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#ff6f91'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, sz * 0.9);
    ctx.bezierCurveTo(-sz * 1.6, -sz * 0.2, -sz * 0.8, -sz * 1.4, 0, -sz * 0.5);
    ctx.bezierCurveTo(sz * 0.8, -sz * 1.4, sz * 1.6, -sz * 0.2, 0, sz * 0.9);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawPoops() {
    for (const q of poops) {
      ctx.save();
      ctx.translate(q.x, q.y);
      const sq = q.landed ? 1 + Math.max(0, 0.3 - q.t) * 1.5 : 1; // squish on landing
      ctx.scale(sq, 1 / sq);
      ctx.fillStyle = '#7a4a26'; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.8; ctx.lineJoin = 'round';
      for (const [yy, rx, ry] of [[-3, 8, 3.5], [-8, 6, 3], [-12, 3.8, 2.6]]) {
        ctx.beginPath(); ctx.ellipse(0, yy, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      }
      ctx.beginPath(); ctx.moveTo(-1.5, -14); ctx.quadraticCurveTo(1, -18, 2.5, -16); ctx.quadraticCurveTo(1, -14.5, 1.5, -13.5); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath(); ctx.ellipse(-3, -9, 1.6, 0.9, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      if (q.landed) {
        // stink lines
        ctx.save();
        ctx.strokeStyle = 'rgba(120,160,60,0.75)'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
        for (const sx of [-4, 4]) {
          ctx.beginPath();
          for (let k = 0; k <= 8; k++) {
            const yy = q.y - 20 - k * 2.2, xx = q.x + sx + Math.sin(k * 0.9 + time * 6 + sx) * 2;
            if (k) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
          }
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  function drawExplosions() {
    for (const ex of explosions) {
      const p = ex.t / 0.7;
      const y = ex.y;
      ctx.save();
      // fireball
      const r = 10 + Math.sqrt(p) * 55;
      const fb = ctx.createRadialGradient(ex.x, y, 2, ex.x, y, r);
      fb.addColorStop(0, `rgba(255,250,210,${1 - p})`);
      fb.addColorStop(0.4, `rgba(255,180,60,${0.9 * (1 - p)})`);
      fb.addColorStop(1, 'rgba(255,80,30,0)');
      ctx.fillStyle = fb;
      ctx.beginPath(); ctx.arc(ex.x, y, r, 0, Math.PI * 2); ctx.fill();
      // puffy smoke-and-flame bubbles
      for (let k = 0; k < 6; k++) {
        const a = Math.PI + (k / 5) * Math.PI;
        const d = 8 + p * 40;
        ctx.fillStyle = p < 0.35 ? '#ffd36b' : `rgba(70,50,55,${0.8 * (1 - p)})`;
        ctx.beginPath(); ctx.arc(ex.x + Math.cos(a) * d, y + Math.sin(a) * d * 0.9, 9 * (1 - p * 0.5), 0, Math.PI * 2); ctx.fill();
      }
      // shockwave ring
      ctx.strokeStyle = `rgba(255,240,200,${0.8 * (1 - p)})`; ctx.lineWidth = 3;
      if (ex.air) { ctx.beginPath(); ctx.arc(ex.x, y, 12 + p * 80, 0, Math.PI * 2); ctx.stroke(); }
      else { ctx.beginPath(); ctx.ellipse(ex.x, FLOOR, 12 + p * 90, 4 + p * 14, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.restore();
      // cartoon word
      ctx.save(); ctx.globalAlpha = 1 - p;
      outlinedText(ex.word, ex.x, y - 46 - p * 25, 20 + (1 - p) * 6, '#ffd36b', 800, -0.1);
      ctx.restore();
    }
  }

  function drawPillars() {
    for (const pl of pillars) {
      const p = pl.t;
      const h = Math.sin(Math.min(1, p) * Math.PI) * 170;
      if (h < 2) continue;
      ctx.save();
      ctx.globalAlpha = Math.min(1, (1 - p) * 2.5);
      const g = ctx.createLinearGradient(0, FLOOR - h, 0, FLOOR);
      g.addColorStop(0, 'rgba(255,240,180,0)'); g.addColorStop(0.2, '#ffd36b'); g.addColorStop(0.6, '#ff8a1f'); g.addColorStop(1, '#e2481c');
      ctx.fillStyle = g;
      const w = 26 + p * 20;
      ctx.beginPath();
      ctx.moveTo(pl.x - w, FLOOR);
      for (let k = 0; k <= 6; k++) {
        const yy = FLOOR - (h * k) / 6;
        ctx.lineTo(pl.x - w * (1 - k / 7) + Math.sin(time * 25 + k) * 5, yy);
      }
      for (let k = 6; k >= 0; k--) {
        const yy = FLOOR - (h * k) / 6;
        ctx.lineTo(pl.x + w * (1 - k / 7) + Math.sin(time * 23 + k * 1.7) * 5, yy);
      }
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  function drawStinks() {
    // stinking lava globs flying up at the dragon
    for (const s of lavaShots) {
      for (let k = 4; k >= 1; k--) {
        ctx.fillStyle = `rgba(255,${110 + k * 20},40,${0.45 - k * 0.08})`;
        ctx.beginPath(); ctx.arc(s.x - s.vx * 0.012 * k, s.y - s.vy * 0.012 * k, 9 - k, 0, Math.PI * 2); ctx.fill();
      }
      const g = ctx.createRadialGradient(s.x, s.y, 1, s.x, s.y, 11);
      g.addColorStop(0, '#fff3b0'); g.addColorStop(0.45, '#ff9a2a'); g.addColorStop(1, 'rgba(200,60,20,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(120,180,60,0.85)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(s.x, s.y, 13 + Math.sin(time * 20) * 2, 0, Math.PI * 2); ctx.stroke();
    }
    // a green cloud of stench billowing up from the lava toward the dragon
    for (const st of stinks) {
      const p = st.t / 1.4;
      for (let k = 0; k < 7; k++) {
        const ang = k * 0.9 + st.t * 2;
        const cx = st.x - p * 80 + Math.cos(ang) * (10 + p * 40);
        const cy = FLOOR - 10 - p * 160 + Math.sin(ang) * (8 + p * 25);
        ctx.fillStyle = `rgba(140,200,70,${0.45 * (1 - p)})`;
        ctx.beginPath(); ctx.arc(cx, cy, 10 + p * 18, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  function drawFeathers() {
    for (const f of feathers) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.life);
      ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillStyle = f.col; ctx.strokeStyle = C.outline; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(6, 0); ctx.stroke();
      ctx.restore();
    }
  }

  function outlinedText(text, x, y, size, fill = C.text, weight = 800, rot = 0) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.lineWidth = size * 0.18; ctx.strokeStyle = C.outline;
    ctx.strokeText(text, 0, 0);
    ctx.fillStyle = fill; ctx.fillText(text, 0, 0);
    ctx.restore();
  }

  function drawMuteIcon() {
    ctx.save();
    ctx.translate(W + VX - 30, -VY + SAFE_T + 30);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = 'rgba(58,34,48,0.4)';
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.text;
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-3, -4); ctx.lineTo(3, -9); ctx.lineTo(3, 9); ctx.lineTo(-3, 4); ctx.lineTo(-8, 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = C.text; ctx.lineWidth = 2; ctx.lineCap = 'round';
    if (muted) { ctx.beginPath(); ctx.moveTo(6, -5); ctx.lineTo(12, 5); ctx.moveTo(12, -5); ctx.lineTo(6, 5); ctx.stroke(); }
    else { ctx.beginPath(); ctx.arc(4, 0, 6, -0.9, 0.9); ctx.stroke(); }
    ctx.restore();
  }

  function drawUI() {
    if (state === 'play') {
      outlinedText(String(score), W / 2, 70, 56);
      outlinedText(`of ${GOAL}`, W / 2, 108, 18, C.text, 700);
      if (dbl > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, dbl * 2);
        outlinedText('Double trouble!', W / 2, 165 - (1.6 - dbl) * 10, 36, C.gold, 800, -0.06);
        ctx.restore();
      }
      if (grow > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, grow * 2);
        outlinedText('Bigger bird!', W / 2, 215 - (1.6 - grow) * 10, 28, '#9ff0d6', 800, 0.05);
        ctx.restore();
      }
      if (guardMsg > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, guardMsg * 2);
        outlinedText('Stink bomb! Dragon stunned!', W / 2, 345 - (1.4 - guardMsg) * 10, 21, '#b8f28a', 800, -0.04);
        ctx.restore();
      }
      if (munch > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, munch * 2);
        const lead = birds[0];
        outlinedText('Gulp!', lead.x + 40, lead.y - 34 - (1 - munch) * 16, 22, '#b8f28a', 800, 0.12);
        ctx.restore();
      }
      if (warn > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, warn * 2);
        outlinedText(`A ${DRAGON_COLORS[wave % DRAGON_COLORS.length].name} dragon returns: ${wave >= 4 ? 'walls of fire!' : (wave + 1) + ' fireballs!'}`, W / 2, 300, 19, '#ff8a5c', 800, 0.04);
        ctx.restore();
      }
      if (gulp > 0) {
        ctx.save(); ctx.globalAlpha = Math.min(1, gulp * 2);
        outlinedText(dragonCount > 2 ? 'Dragons down!' : 'Dragon down!', W / 2, 260 - (1.6 - gulp) * 10, 32, '#ffd36b', 800, -0.05);
        ctx.restore();
      }
    }
    if (state === 'won' && ending && ending.t > 2.8) {
      outlinedText('You escaped!', W / 2, 200, 52, C.gold, 800, -0.05);
      outlinedText(`All ${GOAL} obstacles cleared`, W / 2, 255, 22, C.text, 700);
      outlinedText('Golden egg earned', W / 2, 290, 22, C.gold, 700);
      if (performance.now() - overAt > 600) outlinedText('Tap to play again', W / 2, 545, 22, C.text, 700);
    }
    if (state === 'ready') {
      outlinedText('Hot Mess', W / 2, 118, 58, C.gold, 800, -0.04);
      outlinedText('Express', W / 2, 172, 58, '#ff8a5c', 800, -0.04);
      ctx.font = `600 16px ${FONT}`;
      ctx.fillStyle = C.text; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(`Chase the butterfly, escape the dragon!`, W / 2, 222);
      const pulse = reduceMotion ? 1 : 0.6 + Math.sin(time * 4) * 0.4;
      ctx.globalAlpha = pulse;
      outlinedText('Slap the bird to fly', W / 2, H * 0.62, 22, C.text, 700);
      ctx.globalAlpha = 1;
      outlinedText("Don't touch the lava!", W / 2, H * 0.62 + 30, 16, C.text, 700);
      ctx.globalAlpha = 1;
      if (best > 0) outlinedText(`Best ${best}`, W / 2, H * 0.62 + 66, 20, C.gold, 700);
      // privacy policy link (the app builds set window.PRIVACY_URL)
      if (window.PRIVACY_URL) {
        ctx.save(); ctx.globalAlpha = 0.9;
        outlinedText('Privacy policy', W / 2, H + Math.min(VY, 40) - 22, 15, C.text, 700);
        ctx.restore();
      }
    }
    if (state === 'over' && incinerated) {
      const t = Math.max(0, Math.min(1, (performance.now() - overAt) / 400));
      const y = 180 + (1 - t) * 30;
      ctx.globalAlpha = t;
      outlinedText('Incinerated!', W / 2, y - 62, 44, C.red, 800, -0.05);
      outlinedText(roasted ? (wallDeath ? 'Burned by a wall of fire' : 'Roasted by dragon fire') : toasted ? 'Burned up in the lava' : 'Smashed into the rock', W / 2, y - 22, 17, C.text, 700);

      ctx.fillStyle = 'rgba(255,240,222,0.96)';
      roundRect(W / 2 - 120, y, 240, 140, 18); ctx.fill();
      ctx.strokeStyle = C.outline; ctx.lineWidth = 4; ctx.stroke();

      ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = '#7a5566'; ctx.font = `700 16px ${FONT}`; ctx.textAlign = 'center';
      ctx.fillText('Score', W / 2 - 60, y + 30);
      ctx.fillText('Best', W / 2 + 60, y + 30);
      ctx.font = `600 14px ${FONT}`;
      ctx.fillText(`${eggCount - chickCount} eggs smashed, ${chickCount} chicks hatched`, W / 2, y + 132);
      ctx.font = `700 16px ${FONT}`;
      ctx.fillStyle = C.outline; ctx.font = `800 44px ${FONT}`;
      ctx.fillText(String(score), W / 2 - 60, y + 72);
      ctx.fillText(String(best), W / 2 + 60, y + 72);

      const tier = score >= 50 ? 'Silver egg' : score >= 20 ? 'Bronze egg' : null;
      ctx.font = `700 16px ${FONT}`;
      if (newBest) { ctx.fillStyle = C.red; ctx.fillText('New best!', W / 2, y + 112); }
      else if (tier) { ctx.fillStyle = '#7a5566'; ctx.fillText(`${tier} earned`, W / 2, y + 112); }
      else { ctx.fillStyle = '#7a5566'; ctx.fillText(`${GOAL - score} obstacles short of winning`, W / 2, y + 112); }

      outlinedText(`${poopCount} poops dropped`, W / 2, y + 160, 16, C.text, 700);
      if (performance.now() - overAt > 600) {
        const pulse = reduceMotion ? 1 : 0.6 + Math.sin(time * 4) * 0.4;
        ctx.globalAlpha = t * pulse;
        outlinedText('Tap to try again', W / 2, y + 190, 22, C.text, 700);
      }
      ctx.globalAlpha = 1;
    }
    if (state === 'play' && !paused) {
      // pause button, top left
      ctx.save(); ctx.translate(-VX + 30, -VY + SAFE_T + 30); ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(58,34,48,0.4)'; ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = C.text; ctx.fillRect(-6, -7, 4, 14); ctx.fillRect(2, -7, 4, 14);
      ctx.restore();
    }
    if (paused) {
      ctx.fillStyle = 'rgba(20,10,18,0.55)'; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY);
      outlinedText('Paused', W / 2, H * 0.4, 48, C.gold, 800, -0.03);
      outlinedText('Tap to keep flying', W / 2, H * 0.4 + 52, 20, C.text, 700);
    }
    drawMuteIcon();
  }

  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame); // keep the game running even if one frame hits an error
    try { frameInner(now); } catch (e) { console.error(e); resize(); }
  }

  function frameInner(now) {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#1a1018'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.restore();
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (!paused) update(dt);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    if (ending && ending.forest) drawForest(); else drawBackground();
    if (!(ending && ending.forest)) { for (const c of cols) drawColumn(c); }
    drawWalls();
    drawChicks();
    drawEggs();
    drawPoops();
    for (const b of birds) { bird = b; drawBird(); }
    drawGuards();
    if (!(ending && ending.forest)) drawFloor();
    drawExplosions();
    drawStinks();
    drawPillars();
    for (const s of slaps) drawHand(s);
    drawFeathers();
    bugs.forEach(drawBug);
    drawFireballs();
    drawFly();
    ctx.restore();
    drawSideShade();
    if (ending) drawEndingFx();

    if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.6})`; ctx.fillRect(-VX, -VY, W + 2 * VX, H + 2 * VY); }
    drawUI();
  }

  resize();
  canvas.focus({ preventScroll: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
  requestAnimationFrame(frame);
})();
</script>
<script>
  // offline support for the installable web app (not needed inside the native Android app)
  if ('serviceWorker' in navigator && !window.Capacitor && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
